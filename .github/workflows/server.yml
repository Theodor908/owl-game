# Tests the Rust side on every push, and when the server or the content
# changed on master, builds the server image for the Raspberry Pi and puts
# it in this repository's private registry. The Pi fetches it from there by
# itself (deploy/update.sh); nothing here ever connects to the Pi.

name: server

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Everything but the Godot extension, which needs the engine's own build.
      - run: cargo test --workspace --exclude owl-local
      - run: cargo clippy --workspace --exclude owl-local --all-targets -- -D warnings

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # An ARM machine, like the Pi, so the image is built without emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/theodor908/owl-server:latest
            ghcr.io/theodor908/owl-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
