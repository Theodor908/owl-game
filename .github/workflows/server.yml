# Runs the Rust tests on every push and pull request.

name: server

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Everything but the Godot extension, which needs the engine's own build.
      - run: cargo test --workspace --exclude owl-local
      - run: cargo clippy --workspace --exclude owl-local --all-targets -- -D warnings

