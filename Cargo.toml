[workspace]
resolver = "3"
members = ["crates/core", "crates/lobby", "crates/local", "crates/protocol", "crates/release", "crates/server", "crates/sim"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Loops over the two sides of a battle index several arrays at once.
needless_range_loop = "allow"
