[package]
name = "owl-server"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
hmac = "0.13.0"
owl-core = { path = "../core" }
owl-lobby = { path = "../lobby" }
owl-protocol = { path = "../protocol" }
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }

[dev-dependencies]
argon2 = "0.6.0"
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
